name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest nbconvert ipykernel
      - name: Smoke tests (algorithms and Streamlit app)
        run: pytest -q
      - name: Run the notebooks
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute demo.ipynb --output-dir=/tmp/nbout
          jupyter nbconvert --to notebook --execute Optimized_Algorithm.ipynb --output-dir=/tmp/nbout
